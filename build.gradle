plugins {
	id 'org.relativitymc.neo-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
	maven { url "https://maven.shedaniel.me/" }
	maven { url = "https://maven.architectury.dev" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven {
		name 'Xander Maven'
		url 'https://maven.isxander.dev/releases'
	}
	maven {
		name = 'RelativityMC'
		url = 'https://repo.codemc.io/repository/relativitymc/'
	}
	maven {
		name = "NeoForge"
		url = uri("https://maven.neoforged.net/releases/")
		content {
			includeGroupAndSubgroups("net.neoforged")
			includeGroupAndSubgroups("cpw.mods")
			includeGroupAndSubgroups("net.minecraftforge")
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

sourceSets {
	fabric {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}
	neoforge {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		createSourceSet = true
		modId = "immersive-storms-datagen"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	api include("dev.yumi.mc.core:yumi-mc-foundation:${project.yumi_version}")
	implementation("dev.yumi.mc.core:yumi-mc-foundation:${project.yumi_version}")
	compileOnlyApi("dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric") {
		exclude group: "net.fabricmc.fabric-api"
	}

	fabricCompileOnly localRuntime("net.fabricmc:fabric-loader:${project.fabric_loader_version}")
	fabricCompileOnly localRuntime("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
	fabricCompileOnly localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}")
	fabricCompileOnly localRuntime("dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric")

	neoforgeCompileOnly("net.neoforged:neoforge:${project.neoforge_version}:universal")
	neoforgeCompileOnly("net.neoforged.fancymodloader:loader:${project.neoforge_loader_version}")
	neoforgeCompileOnly("dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge")

	// compatibility patches
	compileOnly "maven.modrinth:DistantHorizonsApi:${project.distant_horizons_api_version}"
	compileOnly "maven.modrinth:particle-rain:${project.particle_rain_version}"
	compileOnly "maven.modrinth:subtle-effects:${project.subtle_effects_version}"

	neoforgeImplementation sourceSets.main.output
	fabricImplementation sourceSets.main.output

	localRuntime sourceSets.fabric.output
	localRuntime sourceSets.neoforge.output
}

loom {
	accessWidenerPath = file("src/main/resources/immersive-storms.classtweaker")
	convertAw2At(tasks.named("jar", Jar), ["immersive-storms.classtweaker"])
}

def resourceTargets = ["fabric.mod.json", "META-INF/neoforge.mods.toml", "META-INF/jarjar/metadata.json"]
def replaceProperties = [
		"version": project.version,
		"yumi_version": project.yumi_version,
		"yacl_version": project.yacl_version
]

processResources {
	inputs.property "version", project.version

	filesMatching(resourceTargets) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}

	from(sourceSets.neoforge.output)
	from(sourceSets.fabric.output)
}

sourcesJar {
	from(sourceSets.neoforge.java.sourceDirectories)
	from(sourceSets.neoforge.resources.sourceDirectories)
	from(sourceSets.fabric.java.sourceDirectories)
	from(sourceSets.fabric.resources.sourceDirectories)
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
	changelog = file("changelogs/${mod_version}.md").text
	type = STABLE

	file = jar.archiveFile
	additionalFiles.from(sourcesJar.archiveFile)
	displayName = "Immersive Storms ${mod_version}"

	modLoaders.add("fabric")
	modLoaders.add("quilt")
	modLoaders.add("neoforge")

	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
		projectId = "1288370"
		minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

		javaVersions.add(JavaVersion.VERSION_25)

		clientRequired = true
		serverRequired = true

		requires("fabric-api", "yacl")
	}

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = "SdJDElEu"
		minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

		requires("fabric-api", "yacl")
	}
}
