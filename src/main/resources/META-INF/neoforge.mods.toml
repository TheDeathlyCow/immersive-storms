modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"
issueTrackerURL = "https://github.com/TheDeathlycow/immersive-storms/issues"

[[mods]]
modId = "immersive_storms"
version = "${version}"
displayName = "Immersive Storms"
description = "Immersive weather effects for mountains, deserts, swamps, and more!"
authors = "TheDeathlyCow"
logoFile = "assets/immersive-storms/icon.png"
logoBlur = false
iconFile = "assets/immersive-storms/icon.png"
displayURL = "https://www.thedeathlycow.com/"
issueTrackerURL = "https://github.com/TheDeathlycow/immersive-storms/issues"


[[mixins]]
config = "immersive-storms.mixins.json"

[[mixins]]
config = "immersive-storms.client.mixins.json"

[[dependencies.immersive_storms]]
modId = "minecraft"
type = "required"
versionRange = "[26.3,26.4)"
ordering = "NONE"
side = "BOTH"

[[dependencies.immersive_storms]]
modId = "yumi_mc_core"
type = "required"
versionRange = "[1.1.3,)"
ordering = "NONE"
side = "CLIENT"

[modproperties.immersive_storms]
catalogueImageIcon = "assets/immersive-storms/icon.png"

[[modproperties.immersive_storms."yumi:entrypoints"."yumi:init"]]
value = "com.thedeathlycow.immersive.storms.ImmersiveStorms"

[[modproperties.immersive_storms."yumi:entrypoints"."yumi:client_init"]]
value = "com.thedeathlycow.immersive.storms.client.ImmersiveStormsClient"
